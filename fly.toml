# Fly.io — plataforma recomendada: tem volume persistente no plano gratuito.
# Veja DEPLOY.md para o passo a passo.
app = "xibatapaterna"
primary_region = "gru"          # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TZ_APP = "America/Sao_Paulo"

# O db.json vive aqui. Sem este mount os dados somem a cada deploy.
[mounts]
  source = "xibata_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
